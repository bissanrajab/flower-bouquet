<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3eb">
    <meta name="description" content="A colorful bouquet of lilies, hydrangeas, orchids, and a white rose, illustrated in SVG.">
    <title>A little bouquet</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f7f3eb;
        color: #344b3e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 5vw, 4rem);
        background:
          radial-gradient(ellipse at 50% 43%, #fffdf8 0, #fffdf8 26%, transparent 68%),
          #f7f3eb;
      }

      main {
        width: min(100%, 680px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.6rem;
        color: #9c8060;
        font: 600 0.72rem/1.4 system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .subtitle {
        margin: 0.9rem 0 1.4rem;
        color: #788276;
        font: 0.95rem/1.6 system-ui, sans-serif;
      }

      .artwork {
        display: block;
        width: min(100%, 600px);
        height: auto;
        margin: 0 auto;
        overflow: visible;
      }

      @media (max-width: 420px) {
        body {
          padding: 1.5rem 1rem;
        }

        .subtitle {
          margin-bottom: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Gathered with love</p>
      <h1>A little bouquet</h1>
      <p class="subtitle">Lilies, hydrangeas &amp; a rose, wrapped just for you.</p>

      <svg class="artwork" viewBox="0 0 760 800" role="img" aria-labelledby="bouquet-title bouquet-description" xmlns="http://www.w3.org/2000/svg">
        <title id="bouquet-title">A colorful hand-tied flower bouquet</title>
        <desc id="bouquet-description">Pink and coral lilies, blue and violet hydrangeas, magenta orchids, a white rose, green leaves and stems, gathered in a warm kraft-paper wrap.</desc>
        <defs>
          <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#dfbd87"/>
            <stop offset=".48" stop-color="#c89d68"/>
            <stop offset="1" stop-color="#af8050"/>
          </linearGradient>
          <linearGradient id="paper-fold" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#ecd3a7"/>
            <stop offset="1" stop-color="#d5b17d"/>
          </linearGradient>
          <linearGradient id="orchid" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#f9b9df"/>
            <stop offset=".6" stop-color="#d66ab0"/>
            <stop offset="1" stop-color="#a94491"/>
          </linearGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#90a978"/>
            <stop offset="1" stop-color="#42654d"/>
          </linearGradient>
          <linearGradient id="rose-petal" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#fffefa"/>
            <stop offset="1" stop-color="#dedbd0"/>
          </linearGradient>
          <symbol id="hydrangea-floret" viewBox="-12 -12 24 24">
            <path d="M0-10C3-10 4-6 2-3 6-7 10-5 9-2 8 1 5 2 2 1 6 3 6 8 3 9 0 10-2 6-1 3-3 7-8 7-9 4-10 1-7-1-3-1-7-2-8-7-5-9-2-10 0-7 0-4Z" fill="currentColor"/>
            <circle r="2" fill="#f3d9a1"/>
          </symbol>
          <g id="lily">
            <g fill="currentColor" stroke="#fff1df" stroke-opacity=".55" stroke-width="1">
              <path d="M0 0C-12-13-31-36-28-59-26-79-11-71 0-43 11-71 26-79 28-59 31-36 12-13 0 0Z"/>
              <path d="M0 0C-17-7-46-18-55-39-63-57-47-60-29-39-33-66-25-78-11-64 4-48 4-19 0 0Z" transform="rotate(60)"/>
              <path d="M0 0C-17-7-46-18-55-39-63-57-47-60-29-39-33-66-25-78-11-64 4-48 4-19 0 0Z" transform="rotate(120)"/>
              <path d="M0 0C-12-13-31-36-28-59-26-79-11-71 0-43 11-71 26-79 28-59 31-36 12-13 0 0Z" transform="rotate(180)"/>
              <path d="M0 0C-17-7-46-18-55-39-63-57-47-60-29-39-33-66-25-78-11-64 4-48 4-19 0 0Z" transform="rotate(240)"/>
              <path d="M0 0C-17-7-46-18-55-39-63-57-47-60-29-39-33-66-25-78-11-64 4-48 4-19 0 0Z" transform="rotate(300)"/>
            </g>
            <g fill="none" stroke="#d56d69" stroke-linecap="round" stroke-width="1.2" opacity=".8">
              <path d="M0-4 0-53M2-3 18-43M3-1 40-28M0 3 0 44M-3 1-40 28M-2-3-18-43"/>
            </g>
            <g stroke="#c98142" stroke-width="1.5">
              <path d="M0 0-8-26M0 0 3-31M0 0 14-24M0 0-18-19" fill="none"/>
              <circle cx="-8" cy="-26" r="2.5" fill="#f6c96f"/>
              <circle cx="3" cy="-31" r="2.5" fill="#f6c96f"/>
              <circle cx="14" cy="-24" r="2.5" fill="#f6c96f"/>
              <circle cx="-18" cy="-19" r="2.5" fill="#f6c96f"/>
            </g>
          </g>
          <g id="orchid-bloom">
            <path d="M0 0C-13-8-40-4-42-21-44-35-27-43-10-28-14-47-2-57 8-46 17-36 10-22 8-15 25-37 46-31 45-16 44-1 17 2 0 0Z" fill="url(#orchid)" stroke="#b95299" stroke-width="1.5"/>
            <path d="M-10-6C-16 5-15 20-3 24 7 28 18 20 13 10 10 4 4 0 0-5Z" fill="#e58bc4"/>
            <path d="M-4 11C-1 3 8 1 13 8 18 15 11 22 5 19 2 18 0 15-4 11Z" fill="#f1c96e"/>
            <path d="M-4 10Q2 12 7 8M-2 14Q3 16 8 12" fill="none" stroke="#9e477f" stroke-linecap="round" stroke-width="1.5"/>
            <circle cx="4" cy="12" r="2" fill="#8d4a73"/>
          </g>
        </defs>

        <!-- Stems and foliage form the loose, gathered silhouette. -->
        <g fill="none" stroke="#557452" stroke-linecap="round">
          <path d="M377 613C371 490 286 372 230 208" stroke-width="7"/>
          <path d="M381 615C390 485 449 363 518 188" stroke-width="7"/>
          <path d="M370 615C359 492 358 379 375 239" stroke-width="6"/>
          <path d="M391 614C407 508 474 415 580 300" stroke-width="6"/>
          <path d="M362 615C340 521 255 447 178 354" stroke-width="6"/>
          <path d="M383 615C393 505 340 402 296 302" stroke-width="5"/>
          <path d="M400 615C427 509 422 421 425 344" stroke-width="5"/>
        </g>
        <g fill="url(#leaf)" stroke="#46634a" stroke-width="1.2">
          <path d="M329 496C268 485 224 445 211 398 257 399 307 426 329 496Z"/>
          <path d="M320 459C261 435 226 390 229 349 273 362 310 404 320 459Z"/>
          <path d="M288 413C232 390 193 348 191 309 236 319 276 357 288 413Z"/>
          <path d="M435 491C493 477 533 439 546 393 503 397 458 423 435 491Z"/>
          <path d="M450 441C508 416 539 374 535 335 492 348 456 389 450 441Z"/>
          <path d="M465 399C510 369 537 327 529 291 490 309 464 348 465 399Z"/>
          <path d="M370 462C334 421 326 377 342 345 370 372 384 416 370 462Z"/>
          <path d="M408 452C448 411 460 367 443 336 415 364 400 408 408 452Z"/>
          <path d="M353 541C306 522 281 491 280 462 316 470 346 500 353 541Z"/>
          <path d="M415 541C461 521 485 490 484 461 449 469 421 499 415 541Z"/>
        </g>
        <g fill="none" stroke="#b0bd8e" stroke-linecap="round" stroke-width="1.5" opacity=".8">
          <path d="M323 489 222 405M314 452 238 358M282 407 200 317M441 485 537 400M456 436 527 343M359 454 345 351M415 446 441 342"/>
        </g>

        <!-- Hydrangea clusters, built from small inline SVG florets. -->
        <g aria-hidden="true">
          <g transform="translate(207 292)">
            <use href="#hydrangea-floret" x="-54" y="-25" width="28" height="28" style="color:#7b87c8"/>
            <use href="#hydrangea-floret" x="-34" y="-44" width="32" height="32" style="color:#9aa8df"/>
            <use href="#hydrangea-floret" x="-10" y="-50" width="30" height="30" style="color:#727fc1"/>
            <use href="#hydrangea-floret" x="13" y="-39" width="32" height="32" style="color:#aab8e8"/>
            <use href="#hydrangea-floret" x="30" y="-17" width="30" height="30" style="color:#818dce"/>
            <use href="#hydrangea-floret" x="10" y="2" width="31" height="31" style="color:#9ba9df"/>
            <use href="#hydrangea-floret" x="-16" y="4" width="32" height="32" style="color:#7685c8"/>
            <use href="#hydrangea-floret" x="-39" y="-1" width="31" height="31" style="color:#aab6e1"/>
            <use href="#hydrangea-floret" x="-23" y="-24" width="31" height="31" style="color:#8794d2"/>
            <use href="#hydrangea-floret" x="2" y="-24" width="31" height="31" style="color:#b4bee8"/>
            <use href="#hydrangea-floret" x="-49" y="-49" width="27" height="27" style="color:#8795d1"/>
          </g>
          <g transform="translate(526 302)">
            <use href="#hydrangea-floret" x="-51" y="-21" width="30" height="30" style="color:#ad77b8"/>
            <use href="#hydrangea-floret" x="-29" y="-44" width="31" height="31" style="color:#c292cb"/>
            <use href="#hydrangea-floret" x="-5" y="-50" width="30" height="30" style="color:#a86faf"/>
            <use href="#hydrangea-floret" x="17" y="-35" width="32" height="32" style="color:#c69bd1"/>
            <use href="#hydrangea-floret" x="31" y="-12" width="30" height="30" style="color:#a978b9"/>
            <use href="#hydrangea-floret" x="9" y="3" width="31" height="31" style="color:#be8ac7"/>
            <use href="#hydrangea-floret" x="-17" y="6" width="31" height="31" style="color:#a36cab"/>
            <use href="#hydrangea-floret" x="-41" y="1" width="30" height="30" style="color:#c89ad1"/>
            <use href="#hydrangea-floret" x="-24" y="-23" width="31" height="31" style="color:#b781c2"/>
            <use href="#hydrangea-floret" x="0" y="-24" width="31" height="31" style="color:#d1a5d6"/>
          </g>
        </g>

        <!-- Three open lilies. -->
        <g transform="translate(302 190) rotate(-17) scale(.93)" style="color:#ef9ca5">
          <use href="#lily"/>
        </g>
        <g transform="translate(466 177) rotate(13) scale(.9)" style="color:#f29a7d">
          <use href="#lily"/>
        </g>
        <g transform="translate(372 282) rotate(5) scale(.7)" style="color:#ef9ca5">
          <use href="#lily"/>
        </g>

        <!-- Sprays of orchids and the soft white rose. -->
        <g transform="translate(264 365) rotate(-19) scale(.77)">
          <use href="#orchid-bloom"/>
        </g>
        <g transform="translate(322 386) rotate(12) scale(.62)">
          <use href="#orchid-bloom"/>
        </g>
        <g transform="translate(480 381) rotate(8) scale(.78)">
          <use href="#orchid-bloom"/>
        </g>
        <g transform="translate(554 359) rotate(-12) scale(.62)">
          <use href="#orchid-bloom"/>
        </g>
        <g transform="translate(390 390)">
          <circle r="46" fill="#f2eee3" opacity=".55"/>
          <g fill="url(#rose-petal)" stroke="#d9d4c8" stroke-width="1">
            <ellipse cy="-19" rx="18" ry="27"/>
            <ellipse cy="-19" rx="18" ry="27" transform="rotate(60)"/>
            <ellipse cy="-19" rx="18" ry="27" transform="rotate(120)"/>
            <ellipse cy="-15" rx="14" ry="22" transform="rotate(30)"/>
            <ellipse cy="-15" rx="14" ry="22" transform="rotate(90)"/>
            <ellipse cy="-15" rx="14" ry="22" transform="rotate(150)"/>
            <circle r="15" fill="#fffdf7"/>
          </g>
          <path d="M-8 2C-5-10 9-11 12-2 15 7 4 13-3 8 4 8 7 4 5 0 2-4-3-2-4 2Z" fill="#ece8dc" stroke="#d2cdbf" stroke-width="1"/>
        </g>

        <!-- Kraft paper gathers around the stems. -->
        <path d="M193 431C253 448 320 447 380 437 445 448 508 445 567 428L473 700Q380 744 287 700Z" fill="url(#paper)" stroke="#a87c4f" stroke-width="2"/>
        <path d="M193 431Q286 468 380 437L323 714Q291 708 287 700Z" fill="url(#paper-fold)" opacity=".94"/>
        <path d="M567 428Q475 469 380 437L437 714Q469 708 473 700Z" fill="#b98c5b" opacity=".72"/>
        <path d="M193 431Q281 461 380 437 477 462 567 428" fill="none" stroke="#f0d7ae" stroke-width="3" opacity=".8"/>
        <path d="M380 441Q356 563 323 714M380 441Q405 568 437 714" fill="none" stroke="#a77c51" stroke-width="2" opacity=".55"/>
        <path d="M342 565Q380 550 418 565L405 602Q380 613 355 602Z" fill="#916c4a" opacity=".65"/>
        <path d="M350 565C362 550 390 550 410 565L397 591Q380 601 363 591Z" fill="#d2a56d" stroke="#9d764d" stroke-width="1.5"/>
        <path d="M356 572Q330 583 315 612 344 605 368 588M404 572Q430 583 445 612 416 605 392 588" fill="none" stroke="#c3945d" stroke-linecap="round" stroke-width="12"/>
        <path d="M356 572Q330 583 315 612M404 572Q430 583 445 612" fill="none" stroke="#e0bd88" stroke-linecap="round" stroke-width="3" opacity=".8"/>
      </svg>
    </main>
  </body>
</html>

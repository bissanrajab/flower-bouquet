<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#26362f">
    <meta name="description" content="A full vase arrangement of white and softly colored orchids, hydrangeas, lilies, roses, stock, and seasonal greenery.">
    <title>I love you, my angel</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #26362f;
        color: #fffaf2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 5vw, 4rem);
        background: #26362f;
      }

      main {
        width: min(100%, 680px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.6rem;
        color: #d9c6a8;
        font: 600 0.72rem/1.4 system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .subtitle {
        margin: 0.9rem 0 1.4rem;
        color: #e7ede7;
        font: 0.95rem/1.6 system-ui, sans-serif;
      }

      .artwork {
        display: block;
        width: min(100%, 600px);
        height: auto;
        margin: 0 auto;
        overflow: visible;
      }

      @media (max-width: 420px) {
        body {
          padding: 1.5rem 1rem;
        }

        .subtitle {
          margin-bottom: 0.7rem;
        }
      }
    </style>
  </head>
